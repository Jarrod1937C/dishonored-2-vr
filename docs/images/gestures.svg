<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1034" width="1000" height="1034" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Body gestures: strike, power attack, block, throw, knockout, crouch and lean, zoom, backpack, mouth">
<title>Body gestures: strike, power attack, block, throw, knockout, crouch and lean, zoom, backpack, mouth</title>
<rect x="1" y="1" width="998" height="1032" rx="14" fill="#fbfbfd" stroke="#d7dbe2" stroke-width="2"/>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d43c3c"/></marker>
<marker id="arr1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a0b"/></marker>
</defs>
<text x="28" y="42.0" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">Body moves: the sword, throwing, takedowns, zoom and your backpack</text>
<text x="28" y="66.0" font-size="13.5" fill="#5b6670" font-weight="normal" text-anchor="start">Drawn from the front unless marked. You swing the controller; the in-game blade, grenade or fist follows it.</text>
<rect x="24" y="90" width="306" height="300" rx="10" fill="#ffffff" stroke="#d7dbe2" stroke-width="1.5"/>
<text x="40" y="118.0" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Strike: swing your right arm</text>
<text x="40" y="344.0" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">What the drawn blade touches is hit, harder</text>
<text x="40" y="360.2" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">the faster it moves. A guard can still block</text>
<text x="40" y="376.5" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">or parry it.</text>
<g fill="#c9ced6" stroke="#8a939e" stroke-width="2"><path d="M116,252 Q174,232 232,252 L236,318 L112,318 Z"/><rect x="165" y="210" width="18" height="26" rx="5"/><ellipse cx="174" cy="190" rx="24" ry="29"/></g>
<path d="M122,254 L82,230 L64,192" fill="none" stroke="#7a828d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="64" cy="192" r="9" fill="#e3c4a8" stroke="#a07c5c" stroke-width="2"/>
<line x1="64" y1="192" x2="84" y2="128" stroke="#56606b" stroke-width="5" stroke-linecap="round"/><line x1="64" y1="192" x2="84" y2="128" stroke="#d9dde2" stroke-width="2" stroke-linecap="round"/>
<path d="M54,152 Q184,180 270,290" fill="none" stroke="#d43c3c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<rect x="347" y="90" width="306" height="300" rx="10" fill="#ffffff" stroke="#d7dbe2" stroke-width="1.5"/>
<text x="363" y="118.0" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Power attack (side view)</text>
<text x="363" y="344.0" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">Fist by your right ear, blade pointing forward:</text>
<text x="363" y="360.2" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">it charges. Thrust forward to release it.</text>
<text x="363" y="376.5" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">Lower the blade to cancel.</text>
<g fill="#c9ced6" stroke="#8a939e" stroke-width="2"><path d="M435,240 Q457,230 477,240 Q487,280 479,308 L431,308 Q423,275 435,240 Z"/><rect x="449" y="200" width="16" height="26" rx="5"/><ellipse cx="460" cy="180" rx="23" ry="29"/><circle cx="473" cy="176" r="2.5" fill="#8a939e" stroke="none"/></g>
<path d="M459,244 L479,220 L487,186" fill="none" stroke="#7a828d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="487" cy="186" r="9" fill="#e3c4a8" stroke="#a07c5c" stroke-width="2"/>
<line x1="487" y1="186" x2="567" y2="182" stroke="#56606b" stroke-width="5" stroke-linecap="round"/><line x1="487" y1="186" x2="567" y2="182" stroke="#d9dde2" stroke-width="2" stroke-linecap="round"/>
<path d="M517,220 L632,220" fill="none" stroke="#d43c3c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<text x="577" y="242.0" font-size="13" fill="#d43c3c" font-weight="bold" text-anchor="start">thrust</text>
<rect x="670" y="90" width="306" height="300" rx="10" fill="#ffffff" stroke="#d7dbe2" stroke-width="1.5"/>
<text x="686" y="118.0" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Block</text>
<text x="686" y="344.0" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">Right fist at your left shoulder, blade up.</text>
<text x="686" y="360.2" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">The right grip blocks too (with the sword out).</text>
<g fill="#c9ced6" stroke="#8a939e" stroke-width="2"><path d="M762,242 Q820,222 878,242 L882,308 L758,308 Z"/><rect x="811" y="200" width="18" height="26" rx="5"/><ellipse cx="820" cy="180" rx="24" ry="29"/></g>
<path d="M768,244 L810,292 L856,242" fill="none" stroke="#7a828d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="856" cy="242" r="9" fill="#e3c4a8" stroke="#a07c5c" stroke-width="2"/>
<line x1="856" y1="242" x2="866" y2="160" stroke="#56606b" stroke-width="5" stroke-linecap="round"/><line x1="856" y1="242" x2="866" y2="160" stroke="#d9dde2" stroke-width="2" stroke-linecap="round"/>
<text x="884" y="248.0" font-size="12.5" fill="#d43c3c" font-weight="normal" text-anchor="start">your left</text>
<text x="884" y="263.6" font-size="12.5" fill="#d43c3c" font-weight="normal" text-anchor="start">shoulder</text>
<rect x="24" y="404" width="306" height="300" rx="10" fill="#ffffff" stroke="#d7dbe2" stroke-width="1.5"/>
<text x="40" y="432.0" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Throw a grenade (side view)</text>
<text x="40" y="658.0" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">Hold the LEFT trigger, swing and let go: it flies</text>
<text x="40" y="674.2" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">the way and as hard as your hand moved.</text>
<text x="40" y="690.5" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">Objects: grip to hold, move the hand, let go.</text>
<g fill="#c9ced6" stroke="#8a939e" stroke-width="2"><path d="M102,559 Q124,549 144,559 Q154,599 146,627 L98,627 Q90,594 102,559 Z"/><rect x="116" y="519" width="16" height="26" rx="5"/><ellipse cx="127" cy="499" rx="23" ry="29"/><circle cx="140" cy="495" r="2.5" fill="#8a939e" stroke="none"/></g>
<path d="M126,563 L106,539 L94,505" fill="none" stroke="#7a828d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="94" cy="505" r="9" fill="#e3c4a8" stroke="#a07c5c" stroke-width="2"/>
<path d="M78,479 Q164,449 234,509" fill="none" stroke="#d98a0b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<circle cx="274" cy="533" r="10" fill="#4b5563" stroke="#2c333b" stroke-width="2"/>
<path d="M242,515 L262,527" stroke="#d98a0b" stroke-width="3" marker-end="url(#arr1)"/>
<rect x="347" y="404" width="306" height="300" rx="10" fill="#ffffff" stroke="#d7dbe2" stroke-width="1.5"/>
<text x="363" y="432.0" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Knockout blow (side view)</text>
<text x="363" y="658.0" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">Sneak up behind a guard and hit the back of</text>
<text x="363" y="674.2" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">his head hard: fist, the sword's pommel or</text>
<text x="363" y="690.5" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">the pistol. He drops, no animation.</text>
<g fill="#c9ced6" stroke="#8a939e" stroke-width="2"><path d="M417,559 Q439,549 459,559 Q469,599 461,627 L413,627 Q405,594 417,559 Z"/><rect x="431" y="519" width="16" height="26" rx="5"/><ellipse cx="442" cy="499" rx="23" ry="29"/><circle cx="455" cy="495" r="2.5" fill="#8a939e" stroke="none"/></g>
<path d="M441,563 L469,555 L509,507" fill="none" stroke="#7a828d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="509" cy="507" r="9" fill="#e3c4a8" stroke="#a07c5c" stroke-width="2"/>
<g opacity="0.95"><g fill="#aeb5bf" stroke="#8a939e" stroke-width="2"><path d="M567,559 Q589,549 609,559 Q619,599 611,627 L563,627 Q555,594 567,559 Z"/><rect x="581" y="519" width="16" height="26" rx="5"/><ellipse cx="592" cy="499" rx="23" ry="29"/><circle cx="605" cy="495" r="2.5" fill="#8a939e" stroke="none"/></g>
</g><path d="M479,469 Q529,459 563,491" fill="none" stroke="#d43c3c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<text x="543" y="452.0" font-size="12.5" fill="#d43c3c" font-weight="bold" text-anchor="middle">the back of his head</text>
<rect x="670" y="404" width="306" height="300" rx="10" fill="#ffffff" stroke="#d7dbe2" stroke-width="1.5"/>
<text x="686" y="432.0" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Your body moves the character</text>
<text x="686" y="658.0" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">Crouch for real to crouch, lean to peek, walk</text>
<text x="686" y="674.2" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">around your room to walk. If your head goes</text>
<text x="686" y="690.5" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">into a wall the view fades to dark blue.</text>
<g fill="#c9ced6" stroke="#8a939e" stroke-width="2"><path d="M732,561 Q790,541 848,561 L852,627 L728,627 Z"/><rect x="781" y="519" width="18" height="26" rx="5"/><ellipse cx="790" cy="499" rx="24" ry="29"/></g>
<path d="M870,489 L870,569" stroke="#d43c3c" stroke-width="3" marker-end="url(#arr)"/><text x="882" y="539.0" font-size="13" fill="#d43c3c" font-weight="bold" text-anchor="start">crouch</text>
<path d="M760,469 Q730,467 712,493" fill="none" stroke="#d43c3c" stroke-width="3" marker-end="url(#arr)"/><text x="686" y="473.0" font-size="13" fill="#d43c3c" font-weight="bold" text-anchor="start">lean</text>
<rect x="24" y="718" width="306" height="300" rx="10" fill="#ffffff" stroke="#d7dbe2" stroke-width="1.5"/>
<text x="40" y="746.0" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Zoom: tap the side of your head</text>
<text x="40" y="972.0" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">Tap your RIGHT hand against the side of your</text>
<text x="40" y="988.2" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">head: the spyglass. Again: more zoom (once</text>
<text x="40" y="1004.5" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">upgraded). Again: back to normal.</text>
<g fill="#c9ced6" stroke="#8a939e" stroke-width="2"><path d="M126,880 Q184,860 242,880 L246,946 L122,946 Z"/><rect x="175" y="838" width="18" height="26" rx="5"/><ellipse cx="184" cy="818" rx="24" ry="29"/></g>
<path d="M132,882 L96,858 L144,822" fill="none" stroke="#7a828d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="144" cy="822" r="9" fill="#e3c4a8" stroke="#a07c5c" stroke-width="2"/>
<path d="M88,800 L128,812" stroke="#d43c3c" stroke-width="3" marker-end="url(#arr)"/>
<path d="M122,792 L84,780" stroke="#d43c3c" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="44" y="772.0" font-size="13" fill="#d43c3c" font-weight="bold" text-anchor="start">tap, tap</text>
<rect x="347" y="718" width="306" height="300" rx="10" fill="#ffffff" stroke="#d7dbe2" stroke-width="1.5"/>
<text x="363" y="746.0" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">Your backpack (side view)</text>
<text x="363" y="972.0" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">Touch an item, squeeze the RIGHT grip, then</text>
<text x="363" y="988.2" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">reach behind your back or over your shoulder:</text>
<text x="363" y="1004.5" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">it goes into your inventory. Let go: it goes back.</text>
<g fill="#c9ced6" stroke="#8a939e" stroke-width="2"><path d="M475,873 Q497,863 517,873 Q527,913 519,941 L471,941 Q463,908 475,873 Z"/><rect x="489" y="833" width="16" height="26" rx="5"/><ellipse cx="500" cy="813" rx="23" ry="29"/><circle cx="513" cy="809" r="2.5" fill="#8a939e" stroke="none"/></g>
<path d="M495,877 L483,831 L451,811" fill="none" stroke="#7a828d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="451" cy="811" r="9" fill="#e3c4a8" stroke="#a07c5c" stroke-width="2"/>
<rect x="437" y="791" width="20" height="16" rx="4" fill="#c9a227" stroke="#8a6d10" stroke-width="2"/>
<path d="M589,883 Q537,743 439,777" fill="none" stroke="#d43c3c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<text x="369" y="905.0" font-size="12.5" fill="#d43c3c" font-weight="bold" text-anchor="start">behind your back</text>
<text x="559" y="905.0" font-size="12.5" fill="#5b6670" font-weight="normal" text-anchor="start">from the world</text>
<rect x="670" y="718" width="306" height="300" rx="10" fill="#ffffff" stroke="#d7dbe2" stroke-width="1.5"/>
<text x="686" y="746.0" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">At your mouth (side view)</text>
<text x="686" y="972.0" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">A hand to your mouth + its grip: an elixir</text>
<text x="686" y="988.2" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">(left = health, right = mana). Food you hold:</text>
<text x="686" y="1004.5" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">bring it to your mouth to eat it.</text>
<g fill="#c9ced6" stroke="#8a939e" stroke-width="2"><path d="M768,873 Q790,863 810,873 Q820,913 812,941 L764,941 Q756,908 768,873 Z"/><rect x="782" y="833" width="16" height="26" rx="5"/><ellipse cx="793" cy="813" rx="23" ry="29"/><circle cx="806" cy="809" r="2.5" fill="#8a939e" stroke="none"/></g>
<path d="M792,877 L834,865 L824,829" fill="none" stroke="#7a828d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="824" cy="829" r="9" fill="#e3c4a8" stroke="#a07c5c" stroke-width="2"/>
<circle cx="838" cy="819" r="9" fill="#c0392b" stroke="#7b241c" stroke-width="2"/>
<path d="M910,883 Q900,833 856,825" fill="none" stroke="#d43c3c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr)"/>
</svg>
