<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Holsters, backpack, elixirs, zoom and the wrist watch">
<title>Holsters, backpack, elixirs, zoom and the wrist watch</title>
<rect x="1" y="1" width="998" height="778" rx="14" fill="#fbfbfd" stroke="#d7dbe2" stroke-width="2"/>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6670"/></marker>
</defs>
<text x="28" y="42.0" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">Holsters, backpack, elixirs, zoom and the watch: where your hands go</text>
<text x="28" y="66.0" font-size="13.5" fill="#5b6670" font-weight="normal" text-anchor="start">Front view (your right is on the left of the picture) and side view. The zones are measured from your neck, so they work seated or standing.</text>
<text x="400" y="112.0" font-size="13" fill="#5b6670" font-weight="bold" text-anchor="middle">FRONT</text>
<text x="850" y="112.0" font-size="13" fill="#5b6670" font-weight="bold" text-anchor="middle">SIDE (facing right)</text>
<g transform="translate(400,240) scale(0.9333333333333332)" fill="#c9ced6" stroke="#8a939e" stroke-width="2" stroke-linejoin="round">
<path d="M-95,18 Q0,2 95,18 L108,60 L112,175 L124,242 L104,246 L88,170 L82,95 L62,215 L56,440 L12,440 L0,250 L-12,440 L-56,440 L-62,215 L-82,95 L-88,170 L-104,246 L-124,242 L-112,175 L-108,60 Z"/>
<rect x="-11" y="-22" width="22" height="30" rx="6"/>
<ellipse cx="0" cy="-50" rx="31" ry="38"/>
</g>
<g transform="translate(850,240) scale(0.9333333333333332)" fill="#c9ced6" stroke="#8a939e" stroke-width="2" stroke-linejoin="round">
<path d="M-34,18 Q0,6 28,20 Q44,90 32,150 L36,215 L30,440 L-6,440 L-14,225 Q-44,200 -38,130 Q-50,70 -34,18 Z"/>
<path d="M-4,35 Q14,120 8,178 L20,240 L4,244 L-12,180 Q-20,110 -16,40 Z" fill="#b8bec7"/>
<rect x="-9" y="-22" width="20" height="30" rx="6"/>
<ellipse cx="4" cy="-50" rx="30" ry="38"/>
<circle cx="22" cy="-56" r="3" fill="#8a939e" stroke="none"/>
</g>
<rect x="246.0" y="301.6" width="140.0" height="204.39999999999998" rx="10" fill="#2f6fdf" fill-opacity="0.18" stroke="#2f6fdf" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="414.0" y="301.6" width="140.0" height="204.39999999999998" rx="10" fill="#d43c3c" fill-opacity="0.18" stroke="#d43c3c" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="344.0" y="254.0" width="112.0" height="84.0" rx="10" fill="#7c4ddb" fill-opacity="0.24" stroke="#7c4ddb" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="400" cy="212.0" r="10" fill="#13956b33" stroke="#13956b" stroke-width="2"/>
<rect x="327.2" y="154.4" width="39.199999999999996" height="50.4" rx="8" fill="#d43c3c" fill-opacity="0.2" stroke="#d43c3c" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="493.4" y="446.79999999999995" width="26" height="14" rx="4" fill="#0f8aa3" stroke="#0b6e83" stroke-width="1.5"/>
<rect x="674.8" y="142.0" width="150" height="336.0" rx="10" fill="#d98a0b" fill-opacity="0.18" stroke="#d98a0b" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="824.8" y="301.6" width="95.19999999999999" height="204.39999999999998" rx="10" fill="#6b7280" fill-opacity="0.1" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="824.8" y="254.0" width="109.19999999999999" height="84.0" rx="10" fill="#7c4ddb" fill-opacity="0.22" stroke="#7c4ddb" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="880" y1="664.6666666666666" x2="940" y2="664.6666666666666" stroke="#5b6670" stroke-width="2" marker-end="url(#arr)"/>
<text x="946" y="669.7" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">forward</text>
<text x="24" y="98.0" font-size="15" fill="#d43c3c" font-weight="bold" text-anchor="start">ZOOM</text>
<text x="24" y="117.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">TAP your RIGHT hand against</text>
<text x="24" y="133.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">the side of your head</text>
<line x1="196" y1="112" x2="327.2" y2="179.6" stroke="#d43c3c" stroke-width="1.5"/>
<text x="24" y="170.0" font-size="15" fill="#13956b" font-weight="bold" text-anchor="start">ELIXIR</text>
<text x="24" y="189.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">a hand to your mouth</text>
<text x="24" y="205.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">+ that hand's grip:</text>
<text x="24" y="221.5" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">left = health, right = mana</text>
<line x1="196" y1="190" x2="388" y2="212.0" stroke="#13956b" stroke-width="1.5"/>
<text x="24" y="280.0" font-size="15" fill="#7c4ddb" font-weight="bold" text-anchor="start">LAST POWER</text>
<text x="24" y="299.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">LEFT hand on your chest</text>
<line x1="196" y1="295" x2="344.0" y2="296.0" stroke="#7c4ddb" stroke-width="1.5"/>
<text x="24" y="415.0" font-size="15" fill="#2f6fdf" font-weight="bold" text-anchor="start">PISTOL</text>
<text x="24" y="434.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">LEFT hand at your</text>
<text x="24" y="450.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">RIGHT hip (a cross-draw)</text>
<line x1="196" y1="430" x2="246.0" y2="430" stroke="#2f6fdf" stroke-width="1.5"/>
<text x="572" y="310.0" font-size="15" fill="#d43c3c" font-weight="bold" text-anchor="start">SWORD</text>
<text x="572" y="329.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">RIGHT hand at</text>
<text x="572" y="345.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">your LEFT hip</text>
<line x1="568" y1="322" x2="554.0" y2="340" stroke="#d43c3c" stroke-width="1.5"/>
<text x="572" y="570.0" font-size="15" fill="#0f8aa3" font-weight="bold" text-anchor="start">WATCH</text>
<text x="572" y="589.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">turn the back of your</text>
<text x="572" y="605.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">LEFT wrist to your eyes:</text>
<text x="572" y="621.5" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">health, mana, ammo</text>
<line x1="568" y1="575" x2="520.4" y2="456.79999999999995" stroke="#0f8aa3" stroke-width="1.5"/>
<text x="682.8" y="168.0" font-size="15" fill="#d98a0b" font-weight="bold" text-anchor="start">CROSSBOW</text>
<text x="682.8" y="187.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">LEFT hand behind</text>
<text x="682.8" y="203.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">your back or over</text>
<text x="682.8" y="219.5" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">your shoulder</text>
<text x="682.8" y="300.0" font-size="15" fill="#d43c3c" font-weight="bold" text-anchor="start">BACKPACK</text>
<text x="682.8" y="319.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">an item in your</text>
<text x="682.8" y="335.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">RIGHT hand (grip</text>
<text x="682.8" y="351.5" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">held) behind your</text>
<text x="682.8" y="367.8" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">back or over your</text>
<text x="682.8" y="384.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">shoulder: into your</text>
<text x="682.8" y="400.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">inventory</text>
<text x="926.0" y="436.0" font-size="12.5" fill="#5b6670" font-weight="normal" text-anchor="start" font-style="italic">hips</text>
<text x="940.0" y="301.6" font-size="12.5" fill="#7c4ddb" font-weight="normal" text-anchor="start" font-style="italic">chest</text>
<line x1="24" y1="706" x2="976" y2="706" stroke="#d7dbe2" stroke-width="1.5"/>
<text x="28" y="730.0" font-size="13.5" fill="#1f2933" font-weight="normal" text-anchor="start">Squeeze that hand's GRIP inside the zone to draw. Do the same with the weapon in your hand to put it away: the hand stays empty.</text>
<text x="28" y="752.0" font-size="13.5" fill="#5b6670" font-weight="normal" text-anchor="start">A light buzz tells you the hand is in a holster. The power on the chest is the last one you held in the left hand.</text>
</svg>
