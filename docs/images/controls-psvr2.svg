<g transform="translate(680 208.64000000000001) scale(-1.12 1.12)"><path d="M -46 -40 C -120 -40 -150 60 -118 140 C -96 196 -60 238 -20 246 C 0 250 14 240 14 226 L 14 214 C -30 206 -70 170 -86 120 C -104 60 -86 0 -46 -12 Z" fill="#c3c9d1" stroke="#6f7883" stroke-width="2.2" vector-effect="non-scaling-stroke"/><path d="M -34 30 C -40 110 -36 190 -26 232 C -20 252 10 252 16 232 C 26 190 30 110 26 34 Z" fill="#e3e7ec" stroke="#6f7883" stroke-width="2.2" vector-effect="non-scaling-stroke"/><ellipse cx="-4" cy="0" rx="64" ry="52" fill="#3a4049" stroke="#6f7883" stroke-width="2.2" vector-effect="non-scaling-stroke"/><rect x="-22.0" y="-65.0" width="36" height="14" rx="6" fill="#d98a0b" fill-opacity="0.85" stroke="#d98a0b" stroke-width="2" vector-effect="non-scaling-stroke"/><rect x="-22" y="-66" width="36" height="6" rx="3" fill="#13956b" stroke="#13956b" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="-18" cy="-14" r="22" fill="#eef1f4" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="-18" cy="-14" r="15" fill="#cfd5dc" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="28" cy="-18" r="10" fill="#ffffff" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="12" cy="12" r="10" fill="#ffffff" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="-18" cy="30" r="7" fill="#ffffff" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/><rect x="-57" y="-29" width="6" height="18" rx="3" fill="#ffffff" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/></g>
<text x="30" y="140.0" font-size="14.5" fill="#13956b" font-weight="bold" text-anchor="start">L1 (grip)</text>
<text x="30" y="158.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">hold: power wheel - holsters</text>
<line x1="292" y1="136" x2="415.52" y2="134.72000000000003" stroke="#13956b" stroke-width="1.3"/>
<circle cx="292" cy="136" r="2.5" fill="#13956b"/><circle cx="415.52" cy="134.72000000000003" r="2.5" fill="#13956b"/>
<text x="30" y="186.0" font-size="14.5" fill="#d98a0b" font-weight="bold" text-anchor="start">L2 (trigger)</text>
<text x="30" y="204.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">power, pistol or crossbow - grenade:</text>
<text x="30" y="220.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">hold, swing, let go</text>
<line x1="292" y1="182" x2="415.52" y2="145.92000000000002" stroke="#d98a0b" stroke-width="1.3"/>
<circle cx="292" cy="182" r="2.5" fill="#d98a0b"/><circle cx="415.52" cy="145.92000000000002" r="2.5" fill="#d98a0b"/>
<text x="30" y="248.0" font-size="14.5" fill="#9aa3ad" font-weight="bold" text-anchor="start">Create</text>
<text x="30" y="266.0" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">not used: SteamVR does not pass it</text>
<text x="30" y="282.2" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">(press BOTH STICKS for the menu)</text>
<line x1="292" y1="244" x2="359.52" y2="186.24" stroke="#9aa3ad" stroke-width="1.3"/>
<circle cx="292" cy="244" r="2.5" fill="#9aa3ad"/><circle cx="359.52" cy="186.24" r="2.5" fill="#9aa3ad"/>
<text x="30" y="310.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">Left stick</text>
<text x="30" y="328.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">move - click: sprint</text>
<line x1="292" y1="306" x2="399.84" y2="192.96" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="292" cy="306" r="2.5" fill="#2f6fdf"/><circle cx="399.84" cy="192.96" r="2.5" fill="#2f6fdf"/>
<text x="30" y="356.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">Triangle</text>
<text x="30" y="374.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">quick slot 1 (hold 0.5 s: slot 3)</text>
<line x1="292" y1="352" x2="441.3655212443543" y2="198.73537880348388" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="292" cy="352" r="2.5" fill="#2f6fdf"/><circle cx="441.3655212443543" cy="198.73537880348388" r="2.5" fill="#2f6fdf"/>
<text x="30" y="402.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">Square</text>
<text x="30" y="420.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">quick slot 2 (hold 0.5 s: slot 4)</text>
<line x1="292" y1="398" x2="424.4671610148703" y2="233.24022224451366" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="292" cy="398" r="2.5" fill="#2f6fdf"/><circle cx="424.4671610148703" cy="233.24022224451366" r="2.5" fill="#2f6fdf"/>
<text x="30" y="448.0" font-size="14.5" fill="#9aa3ad" font-weight="bold" text-anchor="start">PS button</text>
<text x="30" y="466.0" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">not used (SteamVR's)</text>
<line x1="292" y1="444" x2="399.84" y2="242.24" stroke="#9aa3ad" stroke-width="1.3"/>
<circle cx="292" cy="444" r="2.5" fill="#9aa3ad"/><circle cx="399.84" cy="242.24" r="2.5" fill="#9aa3ad"/>
<text x="820" y="140.0" font-size="14.5" fill="#13956b" font-weight="bold" text-anchor="start">R1 (grip)</text>
<text x="820" y="158.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">grab, carry, pull open, throw - blocks</text>
<text x="820" y="174.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">with the sword out - left hip: sword</text>
<line x1="810" y1="136" x2="684.48" y2="134.72000000000003" stroke="#13956b" stroke-width="1.3"/>
<circle cx="810" cy="136" r="2.5" fill="#13956b"/><circle cx="684.48" cy="134.72000000000003" r="2.5" fill="#13956b"/>
<text x="820" y="202.0" font-size="14.5" fill="#d98a0b" font-weight="bold" text-anchor="start">R2 (trigger)</text>
<text x="820" y="220.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">interact: use, open, take</text>
<line x1="810" y1="198" x2="684.48" y2="145.92000000000002" stroke="#d98a0b" stroke-width="1.3"/>
<circle cx="810" cy="198" r="2.5" fill="#d98a0b"/><circle cx="684.48" cy="145.92000000000002" r="2.5" fill="#d98a0b"/>
<text x="820" y="248.0" font-size="14.5" fill="#9aa3ad" font-weight="bold" text-anchor="start">Options</text>
<text x="820" y="266.0" font-size="13" fill="#5b6670" font-weight="normal" text-anchor="start">not used</text>
<line x1="810" y1="244" x2="740.48" y2="186.24" stroke="#9aa3ad" stroke-width="1.3"/>
<circle cx="810" cy="244" r="2.5" fill="#9aa3ad"/><circle cx="740.48" cy="186.24" r="2.5" fill="#9aa3ad"/>
<text x="820" y="294.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">Right stick</text>
<text x="820" y="312.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">turn - click: the sword's button</text>
<text x="820" y="328.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">(hold: power attack)</text>
<line x1="810" y1="290" x2="700.16" y2="192.96" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="810" cy="290" r="2.5" fill="#2f6fdf"/><circle cx="700.16" cy="192.96" r="2.5" fill="#2f6fdf"/>
<text x="820" y="356.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">Circle</text>
<text x="820" y="374.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">crouch (toggle)</text>
<line x1="810" y1="352" x2="658.6982245254312" y2="198.67286610311422" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="810" cy="352" r="2.5" fill="#2f6fdf"/><circle cx="658.6982245254312" cy="198.67286610311422" r="2.5" fill="#2f6fdf"/>
<text x="820" y="402.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">Cross</text>
<text x="820" y="420.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">jump</text>
<line x1="810" y1="398" x2="675.6092633889307" y2="233.17834366550963" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="810" cy="398" r="2.5" fill="#2f6fdf"/><circle cx="675.6092633889307" cy="233.17834366550963" r="2.5" fill="#2f6fdf"/>
<path d="M 451.36 183.48000000000002 L 456.36 192.48000000000002 L 446.36 192.48000000000002 Z" fill="none" stroke="#1f2933" stroke-width="1.6"/><rect x="428.94" y="217.58" width="9" height="9" fill="none" stroke="#1f2933" stroke-width="1.6"/><circle cx="648.64" cy="188.48000000000002" r="5" fill="none" stroke="#1f2933" stroke-width="1.6"/><path d="M 662.56 218.08 L 670.56 226.08 M 670.56 218.08 L 662.56 226.08" stroke="#1f2933" stroke-width="1.6"/><line x1="24" y1="492" x2="1076" y2="492" stroke="#d7dbe2" stroke-width="1.5"/>
<text x="28" y="514.0" font-size="13.5" fill="#1f2933" font-weight="normal" text-anchor="start">Everywhere: swing to strike, fist by the ear + thrust = power attack, fist at the left shoulder = block, a tap on the side of your head = zoom.</text>
<text x="28" y="536.0" font-size="13.5" fill="#5b6670" font-weight="normal" text-anchor="start">SteamVR presents the Sense controllers as Touch controllers: Square / Triangle = X / Y, Cross / Circle = A / B (touch.json).</text>
</svg>
