<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 572" width="1100" height="572" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="PlayStation VR2 Sense controllers (SteamVR)">
<title>PlayStation VR2 Sense controllers (SteamVR)</title>
<rect x="1" y="1" width="1098" height="570" rx="14" fill="#fbfbfd" stroke="#d7dbe2" stroke-width="2"/>
<text x="28" y="42.0" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">PlayStation VR2 Sense controllers (SteamVR)</text>
<text x="28" y="66.0" font-size="13.5" fill="#5b6670" font-weight="normal" text-anchor="start">Seen from above as you hold them, pointing away from you. Orange: the trigger (under the front, index finger). Green: the grip. The ring goes round your hand.</text>
<text x="420" y="108.0" font-size="14" fill="#5b6670" font-weight="bold" text-anchor="middle">LEFT</text>
<text x="680" y="108.0" font-size="14" fill="#5b6670" font-weight="bold" text-anchor="middle">RIGHT</text>
