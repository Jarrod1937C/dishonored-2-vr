<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 556" width="1100" height="556" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Valve Index controllers">
<title>Valve Index controllers</title>
<rect x="1" y="1" width="1098" height="554" rx="14" fill="#fbfbfd" stroke="#d7dbe2" stroke-width="2"/>
<text x="28" y="42.0" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">Valve Index controllers</text>
<text x="28" y="66.0" font-size="13.5" fill="#5b6670" font-weight="normal" text-anchor="start">Seen from above as you hold them, pointing away from you. Orange: the trigger (under the front, index finger). Green: the grip. The strap side is drawn shaded.</text>
<text x="420" y="108.0" font-size="14" fill="#5b6670" font-weight="bold" text-anchor="middle">LEFT</text>
<text x="680" y="108.0" font-size="14" fill="#5b6670" font-weight="bold" text-anchor="middle">RIGHT</text>
<g transform="translate(420 221.6) scale(1.2 1.2)"><path d="M -54 -30 C -112 -10 -124 80 -104 146 C -92 184 -66 206 -30 214 L -26 198 C -60 190 -80 168 -88 138 C -104 80 -94 20 -52 -6 Z" fill="#c3c9d1" stroke="#6f7883" stroke-width="2.2" vector-effect="non-scaling-stroke"/><path d="M -30 40 C -38 110 -36 160 -26 194 C -20 214 12 214 18 194 C 28 160 30 110 26 40 Z" fill="#e3e7ec" stroke="#6f7883" stroke-width="2.2" vector-effect="non-scaling-stroke"/><circle cx="0" cy="0" r="64" fill="#e3e7ec" stroke="#6f7883" stroke-width="2.2" vector-effect="non-scaling-stroke"/><rect x="-18.0" y="-77.0" width="36" height="14" rx="6" fill="#d98a0b" fill-opacity="0.85" stroke="#d98a0b" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M 24 66 C 30 110 28 160 18 192" fill="none" stroke="#13956b" stroke-width="9" vector-effect="non-scaling-stroke"/><circle cx="-28" cy="-26" r="22" fill="#eef1f4" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="-28" cy="-26" r="15" fill="#cfd5dc" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/><rect x="-10" y="-30" width="30" height="66" rx="15" fill="#ffffff" stroke="#6f7883" stroke-width="2" transform="rotate(-12 5.0 3.0)" vector-effect="non-scaling-stroke"/><circle cx="40" cy="-16" r="8" fill="#ffffff" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="36" cy="14" r="8" fill="#ffffff" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="8" cy="44" r="5" fill="#ffffff" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/></g>
<g transform="translate(680 221.6) scale(-1.2 1.2)"><path d="M -54 -30 C -112 -10 -124 80 -104 146 C -92 184 -66 206 -30 214 L -26 198 C -60 190 -80 168 -88 138 C -104 80 -94 20 -52 -6 Z" fill="#c3c9d1" stroke="#6f7883" stroke-width="2.2" vector-effect="non-scaling-stroke"/><path d="M -30 40 C -38 110 -36 160 -26 194 C -20 214 12 214 18 194 C 28 160 30 110 26 40 Z" fill="#e3e7ec" stroke="#6f7883" stroke-width="2.2" vector-effect="non-scaling-stroke"/><circle cx="0" cy="0" r="64" fill="#e3e7ec" stroke="#6f7883" stroke-width="2.2" vector-effect="non-scaling-stroke"/><rect x="-18.0" y="-77.0" width="36" height="14" rx="6" fill="#d98a0b" fill-opacity="0.85" stroke="#d98a0b" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M 24 66 C 30 110 28 160 18 192" fill="none" stroke="#13956b" stroke-width="9" vector-effect="non-scaling-stroke"/><circle cx="-28" cy="-26" r="22" fill="#eef1f4" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="-28" cy="-26" r="15" fill="#cfd5dc" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/><rect x="-10" y="-30" width="30" height="66" rx="15" fill="#ffffff" stroke="#6f7883" stroke-width="2" transform="rotate(-12 5.0 3.0)" vector-effect="non-scaling-stroke"/><circle cx="40" cy="-16" r="8" fill="#ffffff" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="36" cy="14" r="8" fill="#ffffff" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="8" cy="44" r="5" fill="#ffffff" stroke="#6f7883" stroke-width="2" vector-effect="non-scaling-stroke"/></g>
<text x="30" y="140.0" font-size="14.5" fill="#d98a0b" font-weight="bold" text-anchor="start">Left trigger</text>
<text x="30" y="158.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">power, pistol or crossbow - grenade:</text>
<text x="30" y="174.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">hold, swing, let go</text>
<line x1="292" y1="136" x2="420.0" y2="137.6" stroke="#d98a0b" stroke-width="1.3"/>
<circle cx="292" cy="136" r="2.5" fill="#d98a0b"/><circle cx="420.0" cy="137.6" r="2.5" fill="#d98a0b"/>
<text x="30" y="202.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">Left stick</text>
<text x="30" y="220.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">move - click: sprint</text>
<line x1="292" y1="198" x2="386.4" y2="190.4" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="292" cy="198" r="2.5" fill="#2f6fdf"/><circle cx="386.4" cy="190.4" r="2.5" fill="#2f6fdf"/>
<text x="30" y="248.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">B (front)</text>
<text x="30" y="266.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">health elixir</text>
<line x1="292" y1="244" x2="456.71105849179366" y2="205.06829526557604" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="292" cy="244" r="2.5" fill="#2f6fdf"/><circle cx="456.71105849179366" cy="205.06829526557604" r="2.5" fill="#2f6fdf"/>
<text x="30" y="294.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">Left trackpad, press</text>
<text x="30" y="312.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">edges: quick slots 1 (top), 2 (right),</text>
<text x="30" y="328.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">3 (bottom), 4 (left) - middle: menu</text>
<text x="30" y="344.5" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">(short: journal, hold: pause)</text>
<line x1="292" y1="290" x2="426.0" y2="225.2" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="292" cy="290" r="2.5" fill="#2f6fdf"/><circle cx="426.0" cy="225.2" r="2.5" fill="#2f6fdf"/>
<text x="30" y="372.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">A (back)</text>
<text x="30" y="390.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">mana elixir</text>
<line x1="292" y1="368" x2="453.9512101726547" y2="245.40142033658847" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="292" cy="368" r="2.5" fill="#2f6fdf"/><circle cx="453.9512101726547" cy="245.40142033658847" r="2.5" fill="#2f6fdf"/>
<text x="30" y="418.0" font-size="14.5" fill="#13956b" font-weight="bold" text-anchor="start">Left grip (squeeze the handle)</text>
<text x="30" y="436.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">hold: power wheel - holsters</text>
<line x1="292" y1="414" x2="452.4" y2="377.6" stroke="#13956b" stroke-width="1.3"/>
<circle cx="292" cy="414" r="2.5" fill="#13956b"/><circle cx="452.4" cy="377.6" r="2.5" fill="#13956b"/>
<text x="820" y="140.0" font-size="14.5" fill="#d98a0b" font-weight="bold" text-anchor="start">Right trigger</text>
<text x="820" y="158.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">interact: use, open, take what the</text>
<text x="820" y="174.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">right hand points at</text>
<line x1="810" y1="136" x2="680.0" y2="137.6" stroke="#d98a0b" stroke-width="1.3"/>
<circle cx="810" cy="136" r="2.5" fill="#d98a0b"/><circle cx="680.0" cy="137.6" r="2.5" fill="#d98a0b"/>
<text x="820" y="202.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">Right stick</text>
<text x="820" y="220.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">turn - click: zoom</text>
<line x1="810" y1="198" x2="713.6" y2="190.4" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="810" cy="198" r="2.5" fill="#2f6fdf"/><circle cx="713.6" cy="190.4" r="2.5" fill="#2f6fdf"/>
<text x="820" y="248.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">B (front)</text>
<text x="820" y="266.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">crouch (toggle)</text>
<line x1="810" y1="244" x2="643.2956211565165" y2="205.03987550624205" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="810" cy="244" r="2.5" fill="#2f6fdf"/><circle cx="643.2956211565165" cy="205.03987550624205" r="2.5" fill="#2f6fdf"/>
<text x="820" y="294.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">Right trackpad, press</text>
<text x="820" y="312.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">the sword's button (hold: power</text>
<text x="820" y="328.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">attack) - in cutscenes: skip</text>
<line x1="810" y1="290" x2="674.0" y2="225.2" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="810" cy="290" r="2.5" fill="#2f6fdf"/><circle cx="674.0" cy="225.2" r="2.5" fill="#2f6fdf"/>
<text x="820" y="356.0" font-size="14.5" fill="#2f6fdf" font-weight="bold" text-anchor="start">A (back)</text>
<text x="820" y="374.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">jump</text>
<line x1="810" y1="352" x2="646.499761010725" y2="244.76196796084506" stroke="#2f6fdf" stroke-width="1.3"/>
<circle cx="810" cy="352" r="2.5" fill="#2f6fdf"/><circle cx="646.499761010725" cy="244.76196796084506" r="2.5" fill="#2f6fdf"/>
<text x="820" y="402.0" font-size="14.5" fill="#13956b" font-weight="bold" text-anchor="start">Right grip (squeeze the handle)</text>
<text x="820" y="420.0" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">grab, carry, pull open - blocks with</text>
<text x="820" y="436.2" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">the sword out - left hip: sword</text>
<line x1="810" y1="398" x2="647.6" y2="377.6" stroke="#13956b" stroke-width="1.3"/>
<circle cx="810" cy="398" r="2.5" fill="#13956b"/><circle cx="647.6" cy="377.6" r="2.5" fill="#13956b"/>
<text x="468.0" y="206.9" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="middle">B</text><text x="463.2" y="242.9" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="middle">A</text><text x="632.0" y="206.9" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="middle">B</text><text x="636.8" y="242.9" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="middle">A</text><line x1="24" y1="476" x2="1076" y2="476" stroke="#d7dbe2" stroke-width="1.5"/>
<text x="28" y="498.0" font-size="13.5" fill="#1f2933" font-weight="normal" text-anchor="start">Everywhere: swing to strike, fist by the ear + thrust = power attack, fist at the left shoulder = block, a tap on the side of your head = zoom.</text>
<text x="28" y="520.0" font-size="13.5" fill="#5b6670" font-weight="normal" text-anchor="start">The grips read how hard you squeeze; your fingers move the in-game fingers. Power wheel open: the left pad's edges assign quick slots.</text>
</svg>
