; @user  recommended: 0.8
HudScale = 0.8
; Size of the watch on your left wrist, in centimetres (4 - 15)
; @user  recommended: 8.5
WristHudSize = 8.5
; ---- hidden: most players never need to change these ----
; 1 = the markers the game puts over characters and places (a guard's alert / awareness marker, objectives) are
; placed for the headset's view, over the guard's head. 0 = where the flat game's camera puts them (off to the side)
; Core VR: leave as shipped (the other value is for troubleshooting only)
; @hidden
HudMarkers = 1
; Health, mana and the equipped item as a watch on the back of your LEFT wrist: turn the back of
; the wrist towards you and look at it. While it is on, the game's HUD is kept always visible
