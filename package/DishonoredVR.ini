; =====================================================================================================
;  Dishonored 2 VR - settings
; =====================================================================================================
;  Edit with Notepad, save, and restart the game: settings are read when the game starts.
;  A line starting with ; is a comment. Delete a line (or this whole file) to get the default back.
;  1 = on, 0 = off.
;
;  The settings are in main groups ([Display]) and, within them, subgroups ([Display.Fog]). Each one is marked:
;    @user    for everyone: what you may want to set to your liking
;    @hidden  most players never need to change it: core VR features that are always on (the other
;             value only to troubleshoot), tuning, experiments; listed last in each subgroup.
;             Not in the game's VR options tabs
;  An @user setting also says the value recommended for most players ("recommended: ..."), shown in the game's
;  VR options tabs next to the setting.
;  A setting is found by its name in any group, so an older file (or one moved by hand) still reads.
; =====================================================================================================

; =====================================================================================================
;  CONTROLS
; =====================================================================================================
[Controls]
; How you turn, crouch and hold the controllers, and what the buttons do.

; -----------------------------------------------------------------------------------------------------
[Controls.Turning]
; Turning with the right stick, and what the headset shows during a snap turn.

; Turning with the right stick: smooth or snap
; @user  recommended: snap
TurnMode = snap
; Smooth turning speed at full stick, in degrees per second (30 - 360)
; @user  recommended: 120
SmoothTurnSpeed = 120
; Snap turning step, in degrees (10 - 90)
; @user  recommended: 30
SnapTurnAngle = 30
; Snap turning only: the headset goes black for the moment of each snap, until the picture shows the new
; direction (below the full frame rate you would otherwise see the old view swing round, with a black edge)
; @user  recommended: 1
SnapTurnBlank = 1
; ---- hidden: most players never need to change these ----
; How dark the snap turn's blank is (0 - 1): 1 = black, 0.5 = half as bright, 0.3 = just slightly darker
; This helps mask snapping with lower than required framerate
; @hidden
SnapTurnBlankOpacity = 0.4

; -----------------------------------------------------------------------------------------------------
[Controls.Controllers]
; Which controller profile, and vibration. What depends on the controller -- the button layout, how firmly each grip
; is squeezed, finger tracking, the pointing angle, the quick slots' hold time, the trackpads -- is in its profile:
; VRControllerBindings\<name>.json in the game folder, one file per controller (the VR options tabs show and save
; those too). A profile's settings win over the same names here.

; Which profile: auto = the one made for the controllers the headset reports (until it reports them, or when none is
; for them: the first file, by name); or a file's name without .json to always use that one: touch (Meta Quest
; 1 / 2 / 3 / Pro, Rift, PS VR2 through SteamVR), index (Valve Index), wmr (Windows Mixed Reality, Samsung Odyssey),
; hp_reverb_g2, vive_cosmos, vive_focus3, vive_wands (Vive / Vive Pro), pico (Pico 4 / Neo 3). A name that is not
; there = the first file
; @user  recommended: auto
ControllerBindings = auto
; Controller vibration
; @user  recommended: 1
Haptics = 1
; ---- hidden: most players never need to change these ----
; The controllers only reach the game while it is the window in front on your PC. 1 = when you use a controller (or
; put the headset on) while another window is in front, the game is brought back to the front, and the pause it opened
; on its own is closed. 0 = never touch the windows (if you use your PC desktop from inside the headset)
; @hidden
FocusGameWindow = 1

; -----------------------------------------------------------------------------------------------------
[Controls.Body]
; Your real body's movements turned into the game's.

; How far your head goes below your standing height to crouch, in cm (10 - 80). You stand again about 8 cm above it
; @user  recommended: 30
PhysicalCrouchDepth = 30
; The headset fades to dark blue when your head goes into a wall, floor or door (walking or leaning into it), instead
; of showing the inside of the level; step back out and it clears. 0 = no fade
; @user  recommended: 1
WallFade = 1
; ---- hidden: most players never need to change these ----
; Crouch for real to crouch in the game (stealth, low passages), stand up to stand. The view stays at your real head's
; height. Needs the game's crouch on its default toggle mode. B still crouches / stands as before
; Core VR: leave as shipped (the other value is for troubleshooting only)
; @hidden
PhysicalCrouch = 1
; Roomscale: walking around your room walks the character with you, so you stay in your body without recentring.
; The game's own collision stops it at walls and furniture (your view does not: step back out). 0 = the character
; only moves with the stick, and walking leaves it behind until you recentre
; Core VR: leave as shipped (the other value is for troubleshooting only)
; @hidden
Roomscale = 1
; How far your head may move from the character before it follows, in cm (0 - 50): small leans do not move it. Once
; following, it comes right under your head
; @hidden
RoomscaleDeadzone = 10
; The fastest the character follows your head, in m/s (0.5 - 10): it catches up after a takedown or a cutscene, when
; it did not follow
; @hidden
RoomscaleMaxSpeed = 3
; The colour WallFade fades to, R,G,B (0 - 255 each)
; @hidden
WallFadeColor = 20,34,82

