; @hidden
FogMapsResolution = 1
; The three colours for auto, R,G,B (0-255) and optionally a brightness as a fourth number (the scene is in HDR light,
; so the sky can be brighter than 1). Without it the colour takes the map's own horizon brightness
; @hidden
CheapFogColorNight = 70,80,100
; @hidden
CheapFogColorDusk = 225,205,180
; @hidden
CheapFogColorDay = 250,255,252
; The upper sky's brightness under which a map is night, and from which it is day (dusk between)
; @hidden
CheapFogNightBelow = 0.3
; @hidden
CheapFogDayAbove = 0.5
; The fixed colour's brightness (the log's "for comparison" line says what this map's sky would give)
; @hidden
CheapFogBrightness = 1
