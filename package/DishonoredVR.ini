; =====================================================================================================
;  Dishonored 2 VR - settings
; =====================================================================================================
;  Edit with Notepad, save, and restart the game: settings are read when the game starts.
;  A line starting with ; is a comment. Delete a line (or this whole file) to get the default back.
;  1 = on, 0 = off.
; =====================================================================================================

[Controls]
; Turning with the right stick: smooth or snap
TurnMode = snap
; Smooth turning speed at full stick, in degrees per second (30 - 360)
SmoothTurnSpeed = 120
; Snap turning step, in degrees (10 - 90)
SnapTurnAngle = 20
; Snap turning only: the headset goes black for the moment of each snap, until the picture shows the new
; direction (below the full frame rate you would otherwise see the old view swing round, with a black edge)
SnapTurnBlank = 1
; How dark the snap turn's blank is (0 - 1): 1 = black, 0.5 = half as bright, 0.3 = just slightly darker
; This helps mask snapping with lower than required framerate
SnapTurnBlankOpacity = 0.4
; How long Y / X are held to use quick slot 3 / 4 instead of 1 / 2, in seconds (0.15 - 2)
QuickSlotHoldTime = 0.5
; Button layout: default = the layout in README.txt.
;                classic = Y leans, X interacts, menu button pauses (held: journal)
;                index   = for Valve Index controllers: right trigger = interact (the sword strikes by swinging;
;                          its button is the right trackpad), left trackpad = quick slots 1-4 (press its top / right /
;                          bottom / left) and menu (press its middle), left B / A = health / mana elixir; the grips
;                          are for your hands (grab, pull, holsters; the right one blocks only with the sword out),
;                          and an object you pick up stays in your hand while you hold the grip (see README.txt).
;                          With other controllers it is the default layout
Layout = index
; Controller vibration
Haptics = 1
; How firmly each grip must be squeezed to count (0.05 - 0.95; lower = more sensitive). On Valve Index controllers
; this is the grip's squeeze FORCE, so a hand resting on the grip does nothing. Lower one if that hand needs too hard
; a squeeze, raise it if the hand grabs by itself. (If you changed the grip bindings in SteamVR, reset them there.)
GripThresholdLeft = 0.6
GripThresholdRight = 0.45
; Crouch for real to crouch in the game (stealth, low passages), stand up to stand. The view stays at your real head's
; height. Needs the game's crouch on its default toggle mode. B still crouches / stands as before
PhysicalCrouch = 1
; How far your head goes below your standing height to crouch, in cm (10 - 80). You stand again about 8 cm above it
PhysicalCrouchDepth = 30
; With Layout = index: the in-game fingers follow yours (each finger on its own when SteamVR gives the hand's
; skeleton, else thumb / index / the other three from the controller's sensors). For an empty hand and a hand with a
; power; a hand holding the sword, a gun or an object keeps its grip on it. 0 = the game's hand poses
FingerTracking = 1
; If your in-game hands and weapons point higher or lower than your real controllers (some
; controllers report their pointing direction at another angle than Quest controllers do),
; tilt them here, in degrees: positive = up, negative = down (-60 - 60)
ControllerPitchOffset = 0
; The controllers only reach the game while it is the window in front on your PC. 1 = when you use a controller (or
; put the headset on) while another window is in front, the game is brought back to the front, and the pause it opened
; on its own is closed. 0 = never touch the windows (if you use your PC desktop from inside the headset)
FocusGameWindow = 1

[Gameplay]
; Swing the sword with your arm to strike
SwordGestures = 1
; Experimental: the blade itself deals the damage. When it touches a character, he is struck at once, harder the faster
; the blade moves (no sword attack is played). A guard who is blocking you still blocks or parries it, as in the game.
; 0 = a touch triggers the game's own sword attack, as before
SwordBladeDamage = 1
; How much damage the blade does (0.1 - 5; 1 = a firm swing does what the game's sword attack does)
SwordDamageScale = 1
; Experimental: sneak up behind a guard who cannot see you (you are behind him) and a blue dot marks the back of his
; head: a firm blow near it -- your hand open or closed, the sword's pommel or your pistol -- knocks him out at once
; (the game's own choke knockout, without the animation). A swing of the blade is still the lethal takedown
KnockoutBlow = 1
; The hit sound when a knockout blow lands (0 - 1; 0 = none). Put your own DVR_knockout.wav in the game's folder to
; use that sound instead
KnockoutSoundVolume = 0.8
; 0 = no finishing-move kill animations: a blow that would end a fight with the game's kill animation (a guard who is
; down or knocked out, staggered or nearly dead) is an ordinary blow, which still hits him. Also no kill cam (the
; slow-motion shot of a last kill). Stealth takedowns from behind keep theirs. 1 = the game's
FinisherAnimations = 0
; Throw grenades and springrazors with your hand's motion
ThrowGestures = 1
; Grab and carry objects with the right grip, pointing at them
GrabObjects = 1
; Experimental: solid hands. Your drawn hands stop at walls, tables, props and people (with a buzz) instead of passing through,
; and catch up when you pull back. Reach far through a wall and the hand lets go and follows you through
HandCollision = 1
; Experimental: solid weapons. The sword and the guns in your hands stop at the world the same way, and the blade stops
; at people's bodies too (the hit still lands from your real swing)
WeaponCollision = 1
; With WeaponCollision: how far the blade sinks into a body before it stops, in cm (0 - 15; 0 = it stops at the skin)
SwordBodyDepth = 4
; With HandCollision / WeaponCollision: your hands and weapons push loose objects (bottles, chairs, crates)
PushObjects = 1
; How hard they push: the hand's weight in kg (0.1 - 10). 1 = a bottle flies off, a crate barely slides
PushStrength = 1
; With HandCollision: push a closed door with either hand to open it (the game's own door push, the one Windblast
; uses), push an open one to close it (the game's own interact on that door). Cabinet doors can also be gripped and
; pulled open (PullToOpen)
PushDoors = 1
; With HandCollision: push an open cabinet door with your hand to close it. Point at a drawer, cabinet or cupboard door (or a door), put your hand on it (or close to its front), squeeze the grip and
; pull back to open it; push an open one to close it. Locks and keys work as in the game (it is the game's own interact)
PullToOpen = 1
; Experimental, with HandCollision: items (coins, ammo, elixirs, food, runes, bone charms, keys, blueprints, mission
; items...) are taken by hand. Touch one with your right hand, squeeze the grip (it is then in your hand), and put your
; hand behind your back to keep it. Food cannot be kept: bring it to your mouth to eat it. If the game will not take it (a full
; inventory, full health for food) or you let go, it goes back where it was. Notes and books are not taken by hand:
; read them with interact. Interact still takes any item from afar too
PhysicalPickup = 1
; With HandCollision: point your right hand at a combination safe's number wheel, bring it there (the wheels are
; recessed: resting on the safe's door in front of one is enough) and slide it up or down to turn that wheel a digit
; up or down (about 3.5 cm of hand movement per digit). The safe opens on the right combination as usual
SwipeDials = 1
; With HandCollision: rest either hand on a sliding window (the glass, the frame or its handle will do; or point at it
; and bring your hand close) and slide it up to raise the window, down to lower it
SlideWindows = 1
; Holsters, with the grips. Left hand: reach to your RIGHT hip for the pistol, behind your back (or over your
; shoulder) for the crossbow, to your chest for the last power you used. Right hand: reach to your LEFT hip for the
; sword. The same move with it already in that hand puts it away (the hand is then empty). That squeeze does only
; this (no power wheel, no block)
HolsterWeapons = 1

[Display]
; Aiming reticles on your hands. While they are on, the game's own crosshair is hidden in VR
Reticle = 1
; 1 = the reticles are only a small white dot (with a black edge) where each hand points: no lines, no rings.
; The right hand's dot grows to three times its size when it is on something you can pick up or use
MinimalReticle = 1
; How opaque the reticles are (0.05 - 1)
ReticleOpacity = 0.4
; With 3D on: the game's own interface (prompts, markers, compass, subtitles) on one floating layer for both eyes.
; Drawn into each eye's picture, it was seen double. 0 = in each eye's picture, as before
StereoHud = 1
; How far away that layer floats, in metres (0.5 - 10). It covers the same part of your view at any distance:
; this only changes how far your eyes focus to read it
HudDistance = 2
; The game moves its camera forward and down when you look down (and back and up when you look up), like a neck.
; Your headset already moves your eyes with your real neck, so the world seemed to slide to and fro as you nod.
; 1 = the mod measures how far the game's camera travels while you stand still, and takes it out. 0 = as the game does
CameraPitchFix = 1
; Health, mana and the equipped item as a watch on the back of your LEFT wrist: turn the back of
; the wrist towards you and look at it. While it is on, the game's HUD is kept always visible
; (its "contextual" option would hide it); your own setting comes back when you turn it off.
WristHud = 1
; Size of the watch, in centimetres (4 - 15)
WristHudSize = 8.5
; Turns the game's camera motion blur off (it causes discomfort in VR). The game remembers this
; setting afterwards, as if you had changed it in its own options.
DisableMotionBlur = 1
; No depth of field while the headset shows the game (in a headset it blurs whatever you look at; faster too).
; Your settings for the flat game are not changed. 0 = as the game's options have it. Lens flares, bloom, god rays
; and fog blur are in the game's own options (Options > Visuals)
VrGraphicsTweaks = 1
; Ambient occlusion (the soft shadows in corners and under objects) while the headset shows the game. 0 = off
; (faster). The game's own option only switches between NVIDIA HBAO+ and the game's own ambient occlusion: it never
; turns it off
AmbientOcclusion = 0
; Fog and haze while the headset shows the game. The game draws them at a lower resolution, and in a headset that
; shows as blocks over everything in front of the sky (the game's "high" fog blur only softens them). 0 = no fog
; (also a little faster). Your settings for the flat game are not changed
Fog = 0
; With Fog = 0: maps whose name holds one of these words (separated by commas) keep the game's fog anyway. The
; Void is made of its fog and looks wrong without it. Each map's name is written to the log when it loads, to find
; the one to add. Empty = no fog anywhere
FogMaps = void
; Meta headsets (Link / Air Link) only: turns Meta's ASW off for this game. When the game runs below
; the headset's refresh, ASW invents the missing frames and the edges of moving hands and of the
; world on fast head turns come out warped. Off, the last picture is turned with your head: clean.
; 0 = leave ASW as Meta has it. Other headsets' apps are not touched (see the README).
DisableMetaASW = 1
; 3D. 0 = off: both eyes see the same picture (smoothest). 1 = real depth: the game draws the
; world twice from the same instant, once for each eye, so it runs at about half its frame rate
; (lower RenderScale or the game's graphics settings if it stutters). 2 = the old 3D of version
; 1.0, one eye per frame in turn (depth shimmers when you move: not recommended).
Stereo3D = 1
; How sharp the picture is. The game renders at the resolution your headset asks for (set in
; SteamVR, the Meta Horizon app or Virtual Desktop: raise or lower it there), whatever the size of
; the game's window on your PC screen. 1 = exactly that; lower = faster but softer (0.8 is about
; 35% fewer pixels); above 1 = supersampling, for fast PCs (0.5 - 2; at most 4096 pixels a side
; and 16 megapixels whatever the headset asks for). 0 = render at the size of the game's window
; (blurry). The game must be in a window (Display mode: windowed), not fullscreen or borderless.
RenderScale = 1
; Menus and loading screens on a big screen fixed in the room in front of you (pause: the world
; stops and dims around it). 0 = across your whole view, following your head (old way)
MenuScreen = 1
; Its width, in degrees of your view (30 - 110), and how far away it is, in metres (0.8 - 10)
MenuScreenSize = 62
MenuScreenDistance = 2.4
; How bright the paused world stays around the menu screen (0 = dark room, 1 = as in the game)
MenuBackground = 0.22
; Cutscenes play around you: look anywhere with your head (the right stick turns too). Hold A or X
; for about 3 seconds to skip one. The game paints black bars above and below a cutscene; in a
; headset they hide the world over and under your eyes, so they are removed (1 = keep them)
CutsceneLetterbox = 0
; 0 = in a cutscene your hands stay on the controllers; 1 = they do what the cutscene animates
CutsceneArms = 0

[Cheats]
; These change your game for real: if the game saves (or autosaves) afterwards, the save keeps it.
; Unlock every power, upgrade, bone charm crafting, black market upgrade and weapon on every save you load
; (with full ammo once). 0 = play your save as it is
UnlockEverything = 0
; Mana never runs out: cast powers as often as you like
InfiniteMana = 1
; Ammo, gadgets and elixirs are not used up
InfiniteAmmo = 1
InfiniteHealth = 1

[Advanced]
; Skip the start-up videos (the legal screens and the logos)
SkipIntroVideos = 1
; Write every controller button press to DishonoredVR.log (helps find out why a button does nothing)
LogControllerInput = 0
; Write DVR_heartbeat.txt in the game folder once a second (a detailed status, for troubleshooting)
WriteStatusFile = 0
; While the game itself stops for a moment (a load, a hitch), keep the headset showing the last picture, fixed in the
; room, instead of the headset's hourglass
KeepAliveFrames = 1
; When the headset's runtime stops VR on its own and does not resume it (an Air Link hiccup), start VR again after
; this many seconds (0 = wait for the runtime to resume it). Meta's runtime (Link / Air Link) only: with SteamVR or
; Virtual Desktop VR comes back when their app resumes it
NewSessionAfter = 5
; Experimental, all 1/on by default. With Stereo3D = 1 both eyes are drawn from the same instant, so some of the game's
; work for the right eye repeats exactly what it just did for the left. 1 = the right eye's frame skips it and uses
; the left eye's result (faster). If something then looks wrong or flickers, set that one back to 0.
; The sea's waves (the ocean's simulation)
StereoOceanReuse = 1
; The lighting of reflections (the reflection probes' relighting)
StereoReflectionReuse = 1
; Blood and marks on characters
StereoDecalReuse = 1
; Textures are streamed in once per pair of frames instead of every frame (slightly slower texture loading)
StereoStreamOncePerPair = 1
; The shadows of lamps and other spot / omni lights. The right eye uses the left eye's shadow maps whenever nothing
; about them changed between the two (the sun's shadows are always drawn: the game updates them on alternate frames)
StereoLightShadowReuse = 1
