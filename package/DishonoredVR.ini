; =====================================================================================================
;  SYSTEM
; =====================================================================================================
[System]
; Starting the game, and keeping VR running through hiccups.

; -----------------------------------------------------------------------------------------------------
[System.Startup]
; What happens when the game starts.

; Skip the start-up videos (the legal screens and the logos)
; @user  recommended: 1
SkipIntroVideos = 1
; ---- hidden: most players never need to change these ----
; VR tabs in the game's own Options screen (main menu and pause menu), after its own: one per main group of this
; file, its subgroups as the page's sections, every @user setting as the game's own control. 0 = none
; @hidden
VrOptionsMenu = 1

; -----------------------------------------------------------------------------------------------------
[System.Headset]
; When the game or the headset's runtime stops for a moment.

; While the game itself stops for a moment (a load, a hitch), keep the headset showing the last picture, fixed in the
; room, instead of the headset's hourglass
; @hidden
KeepAliveFrames = 1
; When the headset's runtime stops VR on its own and does not resume it (an Air Link hiccup), start VR again after
; this many seconds (0 = wait for the runtime to resume it). Meta's runtime (Link / Air Link) only: with SteamVR or
; Virtual Desktop VR comes back when their app resumes it
; @hidden
NewSessionAfter = 5

; -----------------------------------------------------------------------------------------------------
[System.Troubleshooting]
; When something goes wrong and you want to report it.

; Debug logging: writes DishonoredVR.log in the game folder (what the mod found and did, the previous session's kept as
; DishonoredVR.prev.log), with the time each render pass takes every 5 s. Send the log with a problem report. It
; lowers the frame rate a little: leave it off for playing. The same as WriteLog = 1 and ProfileRenderPasses = 1
; below (either of those on also logs)
; @user  recommended: 0
DebugLogging = 0

; =====================================================================================================
;  LOGGING
; =====================================================================================================
[Logging]
; Troubleshooting and development: what the mod writes to DishonoredVR.log and the game folder. All off is
; fine for playing (each costs a little), but with WriteLog = 0 there is no log to send with a problem report.

; -----------------------------------------------------------------------------------------------------
[Logging.Files]
; What is written, and where.

; Write DishonoredVR.log in the game folder: what the mod found and did (the previous session's is kept as
; DishonoredVR.prev.log). 0 = no log file and none of the logging's work (the lines are not even put together); the
; settings below that write to the log then write nothing
; @hidden
WriteLog = 0
; Write every controller button press to DishonoredVR.log (helps find out why a button does nothing)
; @hidden
LogControllerInput = 0
; Write DVR_heartbeat.txt in the game folder once a second (a detailed status, for troubleshooting)
; @hidden
WriteStatusFile = 0
; Research for a VR tab in the game's Options screen: what the Options screen sends to its menus and what they call
; back, written to DishonoredVR.log (open Options, each tab, change a value, Apply / Back). 0 = off
; @hidden
LogMenuData = 0

; -----------------------------------------------------------------------------------------------------
[Logging.Profiling]
; Measuring what the frame time is spent on.

; What each of the game's render passes costs (left eye, right eye, other views such as reflections):
; GPU and CPU time, draws, pixels shaded, render targets, written to the log every 5 s, plus one whole frame task by
; task every 30 s. To see what a scene's frame time is spent on. Costs some GPU and CPU time itself. Also: the mod's
; own work at Present step by step (overlay, the headset's frame wait, the eye copies, the layers, xrEndFrame), a
; "hitch" line for every task far slower than its pass usually is and every Present far later than usual, and 40 s
; in (then every 2 minutes) one left-eye frame draw by draw: the depth pass by shader, the full-screen passes
; (POSTPROC, EMISSIVE_ONLY, POST_TONEMAP, SSAO, DOF, CLEAR) one draw at a time with the textures each reads
; @hidden
ProfileRenderPasses = 0
