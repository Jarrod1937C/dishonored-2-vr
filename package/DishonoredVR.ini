; =====================================================================================================
;  DISPLAY
; =====================================================================================================
[Display]
; What you see: the picture, the interface, menus and how the world looks.

; -----------------------------------------------------------------------------------------------------
[Display.Picture]
; 3D, sharpness, and how the picture reaches the headset.

; How sharp the picture is. The game renders at the resolution your headset asks for (set in
; SteamVR, the Meta Horizon app or Virtual Desktop: raise or lower it there), whatever the size of
; the game's window on your PC screen. 1 = exactly that; lower = faster but softer (0.8 is about
; 35% fewer pixels); above 1 = supersampling, for fast PCs (0.5 - 2; at most the largest picture
; the headset's runtime takes, 8192 a side for SteamVR). 0 = render at the size of the game's window
; (blurry). The game must be in a window (Display mode: windowed), not fullscreen or borderless.
; @user  recommended: 1
RenderScale = 1
; Sharpens the picture when the game's anti-aliasing is set to TAA, which looks soft in a headset even with the
; game's own sharpness slider at its maximum. The image TAA keeps for the next frame is left as it is, so the
; sharpening does not build up into halos or shimmer. 0 = off, 1 = strongest. No effect with FXAA or no anti-aliasing.
; @user  recommended: 0.5
TaaSharpening = 0.5
; Meta headsets (Link / Air Link) only: turns Meta's ASW off for this game. When the game runs below
; the headset's refresh, ASW invents the missing frames and the edges of moving hands and of the
; world on fast head turns come out warped. Off, the last picture is turned with your head: clean.
; 0 = leave ASW as Meta has it. Other headsets' apps are not touched (see the README).
; @user  recommended: 1
DisableMetaASW = 1
; ---- hidden: most players never need to change these ----
; 3D. 1 = real depth: the game draws the world twice from the same instant, once for each eye, so it runs at about
; half its frame rate (lower RenderScale or the game's graphics settings if it stutters). The mod is made and tested
; for 1: leave it there, other values are likely to break things. 0 = off: both eyes see the same picture. 2 = the
; old 3D of version 1.0, one eye per frame in turn (depth shimmers when you move).
; @hidden
Stereo3D = 1
; The game moves its camera forward and down when you look down (and back and up when you look up), like a neck.
; Your headset already moves your eyes with your real neck, so the world seemed to slide to and fro as you nod.
; 1 = the mod measures how far the game's camera travels while you stand still, and takes it out. 0 = as the game does
; @hidden
CameraPitchFix = 1
; A limit on the picture's size per eye, in megapixels (the headset's own limit always applies). The game's whole set
; of render targets follows the picture's size, so a very high resolution set in the headset's app can run a graphics
; card out of video memory (stutter, then a crash): set e.g. 16 (4000x4000) if that happens. 0 = no limit
; @hidden
MaxRenderMegapixels = 0

; -----------------------------------------------------------------------------------------------------
[Display.Effects]
; The game's effects that look wrong or uncomfortable in a headset. Your settings for the flat game are not changed.

; Ambient occlusion (the soft shadows in corners and under objects) while the headset shows the game. 0 = off
; (faster). 1 = the game's own ambient occlusion; NVIDIA HBAO+ (the costlier one, the game's own menu option) is held
; off in VR and its option hidden there. The game's option never turns ambient occlusion off
; @user  recommended: 0
AmbientOcclusion = 0
; ---- hidden: most players never need to change these ----
; Turns the game's camera motion blur off (it causes discomfort in VR). The game remembers this
; setting afterwards, as if you had changed it in its own options.
; Core VR: leave as shipped (the other value is for troubleshooting only)
; @hidden
DisableMotionBlur = 1
; No depth of field while the headset shows the game (in a headset it blurs whatever you look at; faster too).
; Your settings for the flat game are not changed. 0 = as the game's options have it. Lens flares, bloom, god rays
; and fog blur are in the game's own options (Options > Visuals)
; Core VR: leave as shipped (the other value is for troubleshooting only)
; @hidden
VrGraphicsTweaks = 1
; The screen overlay the game lays over the picture while sneaking (crouched): made for the flat screen, in the headset
; it showed as a tiny dark square fixed in each eye's view. 1 = not drawn in the headset. 0 = as the game draws it
; @hidden
SkipSneakOverlay = 1

; -----------------------------------------------------------------------------------------------------
[Display.Reticle]
; The aiming reticles on your hands.

; 1 = the reticles are only a small white dot (with a black edge) where each hand points: no lines, no rings.
; The right hand's dot grows to three times its size when it is on something you can pick up or use
; @hidden  recommended: 1
MinimalReticle = 1
; How opaque the reticles are (0.05 - 1)
; @user  recommended: 0.4
ReticleOpacity = 0.4
; ---- hidden: most players never need to change these ----
; Aiming reticles on your hands. While they are on, the game's own crosshair is hidden in VR
; Core VR: leave as shipped (the other value is for troubleshooting only)
; @hidden
Reticle = 1

