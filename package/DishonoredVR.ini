; -----------------------------------------------------------------------------------------------------
[Display.ScreenSpaceShadows]
; Experimental, for looks: sharp sun shadows of characters and small objects traced on screen.

; Screen-space sun shadows (experimental, for looks: about 0.35 - 0.4 ms of GPU time per eye, and taking objects out of
; the shadow maps saves almost nothing): from each point on screen a ray towards the sun, blocked by characters and
; small moving objects between their visible surface and the back of their bounding box. Sharp and drawn every frame;
; only what is on screen casts them; shapes are approximate (a box-shaped object exactly, others fuller). Lamps and
; other lights are not affected. 0 = off: the game's shadow maps only
; ---- hidden: most players never need to change these ----
; @hidden
ScreenSpaceShadows = 0
; With ScreenSpaceShadows = 1: characters cast them: people, guards, animals and your hands (anything with a
; skeleton). 0 = not
; @hidden
ScreenSpaceShadowCharacters = 1
; Only with ScreenSpaceShadows = 1 and ScreenSpaceShadowCharacters = 1 (otherwise characters always keep their normal
; shadows): 1 = characters ALSO stay in the sun's shadow maps. 0 = left out of them (their sun shadows are then only the
; screen-space ones: a character off screen casts none; measured to save very little). Lamps' shadows always keep them
; @hidden
ShadowMapCharacters = 0
; Moving objects smaller than this many metres across (bottles, books, chairs, crates...) cast screen-space shadows
; instead: they are left out of the sun's shadow maps and their shadows are traced on screen with their real size.
; About a third of the moving shadow casters are under 1 m. Off screen they cast no sun shadow. 0 = none
; @hidden
ScreenSpaceShadowSmallObjects = 1
; How far a character's or small object's shadow reaches along the ray towards the sun, in metres (0.2 - 20)
; @hidden
ScreenSpaceShadowLength = 3
; Short contact shadows of everything else (where an object meets the ground or a wall), in metres (0 - 2; 0 = off)
; @hidden
ScreenSpaceShadowContact = 0
; Samples along the ray at most (4 - 64; fewer where the ray is short on screen): more = fewer gaps, more GPU time
; @hidden
ScreenSpaceShadowSteps = 24
; How dark they are (0 - 1)
; @hidden
ScreenSpaceShadowStrength = 1

; =====================================================================================================
;  PERFORMANCE
; =====================================================================================================
[Performance]
; Frame rate: work the game does that a headset does not need, done less often or not at all.

; -----------------------------------------------------------------------------------------------------
[Performance.FrameRate]
; Seeing how fast the game runs in the headset, to judge what the settings below change.

; A small frame-rate counter in the headset, fixed to your view (it moves with your head), in a corner a little way
; out from the centre: off, top-left, top-right, bottom-left or bottom-right. It shows the new pictures per second
; reaching the headset (green at the headset's refresh rate, amber below it, red under three quarters of it), and
; under that the frame time and the headset's refresh rate. It is drawn on top of everything, menus included
; @user  recommended: off
FpsCounter = off
; ---- hidden: most players never need to change these ----
; The counter's size: 1 = 20 cm wide, 1 m away (about 11 degrees across); 0.5 .. 2
; @hidden
FpsCounterSize = 1
; How far from the centre of your view the counter sits, in degrees to the side (and 0.8 of that up or down). Less
; = easier to read without moving your eyes, more = further out of the way; 5 .. 30
; @hidden
FpsCounterAngle = 15

; -----------------------------------------------------------------------------------------------------
[Performance.Shadows]
; How far, how often and how much the game draws into its shadow maps.

; How far away (m) an object still casts a shadow, held while you play (0 = as the game's shadow quality sets it:
; Low 15, High 32, Ultra 75). Ultra's sharp near shadows come from its sun cascades (4 / 12 / 30 / 75 m), not from this
; @user  recommended: 24
ShadowCullDistance = 24
; How often the sun's shadow maps beyond the nearest are redrawn, in frame pairs: 1 = every pair (as the game), 2 =
; every other pair, 4 = every fourth. The nearest (within 4 m at Ultra, 12 m at High) is still redrawn every frame.
; Farther away, moving things' shadows (people walking, swinging doors) update at half / a quarter of the frame rate,
; and on a fast head turn the far shadows may lag a frame at the edges. Resolution is unchanged
; @user  recommended: 4
ShadowSunUpdateEvery = 4
; At Ultra shadow quality, hold the settings that cost without making the shadows sharper at High's values: moving
; objects drawn into the sun's far cascades every frame, and how often lamps redraw their shadows of moving things.
; The sun's cascades, resolution and precision stay Ultra's. 0 = Ultra exactly as the game sets it
; @user  recommended: 1
ShadowUltraTrim = 1
; Lamps and other spot / omni lights redraw their shadows of moving things (people, bodies, thrown objects) only
; when the lamp fills most of your view (70 %) or is within 8 m -- the game's Low setting, at any shadow quality
; (High: 40 % / 17 m, Ultra: 20 % / 30 m). Walls and floors keep their lamp shadows (those are cached). Farther
; lamps' shadows of moving things update less. 0 = as the game's shadow quality sets it
; @user  recommended: 1
ShadowLampFewerUpdates = 1
; ---- hidden: most players never need to change these ----
; Moving objects smaller than this many metres across (bottles, cups, books, small debris) are left out of the sun's
; shadow maps: they cast no sun shadow (unless ScreenSpaceShadows draws one), and the shadow maps have less to draw.
; A small saving (mostly the game's CPU work); it adds up with the other settings. Lamps' shadows keep them. 0 = none
; @hidden
ShadowMapMinObjectSize = 0.3
; How many 2048 x 2048 slices the lamps' shadow cache holds (the game: 12). A lamp's walls and floors are drawn once
; into the cache and copied back each frame -- while they fit. At Ultra a scene's lamps need more than 12 (one round
; lamp at the high "extra" resolution takes 6), so the game redrew every lamp's walls every frame, in both eyes, and
; the right eye could rarely reuse the left's. More slices: those redraws stop. Each slice is 16 MB of video memory
; (32 = 512 MB, 320 MB more than the game's). 0 = the game's own
; @hidden
ShadowLampCacheSlices = 32

; -----------------------------------------------------------------------------------------------------
[Performance.Detail]
; How far away things are drawn, and how detailed (the world, and the HUD's sharpness).

; The game's view distance, used instead of the level its menu's environment detail sets: 0 very low, 1 low, 2 medium,
; 3 high, 4 very high, 5 ultra; -1 = as the game's menu has it. It sets two things: the static models' level of detail
; (r_lodZoomMultiplicator: StaticLodZoom, when not 1, overrides that part) and how far the occlusion culling lets you
; see through the level's doorways, windows and openings (r_umbraGateVisibilityRatio): fewer far objects drawn in every
; pass. The game's values for every level are written to the log at start. The rest of environment detail is untouched.
; The game's levels (from its own table): lod zoom 1 / 1 / 1 / 0.8 / 0.7 / 0.6 and gate visibility 1.15 / 1 / 0.8 /
; 0.5 / 0.2 / 0 from very low to ultra (a higher number for either = less drawn)
; @user  recommended: 3
ViewDistance = 3
; Experimental: the game's level of detail for static models (r_lodZoomMultiplicator, "zoom multiplicator for static
; LODs"), held at this. It scales the distance at which static models (walls, props, buildings) switch to their
; simpler versions: 2 = each switch happens at half the distance (fewer triangles; simpler versions pop in closer),
; 0.5 = twice as far (more detail, slower). 1 = the game's own (not touched). Try 1.5, then 2, with
; ProfileRenderPasses = 1: DEPTHPASS's and FORWARD_WORLD's "M primitives in" should drop. Characters are not affected
; @user  recommended: 1.5
StaticLodZoom = 1.5
; The resolution of the game's HUD (prompts, compass, subtitles) on its panel in the headset, as a share of the
; picture's resolution per side: 0.25, 0.5, 0.75 or 1 (= the picture's, as before). It stays in the same place and the
; same size; only its sharpness changes. Most headsets show the HUD at about half the picture's resolution anyway
; (the picture is rendered larger than the displays), so 0.5 looks the same there; a very high-resolution headset may
; show slightly softer text. Less video memory and a little less work for the headset's compositor
; @user  recommended: 0.5
HudResolution = 0.5
; ---- hidden: most players never need to change these ----
; The HUD's panel is handed to the headset only where it shows something: when nothing is on it (most of the time
; with the HUD's elements set to contextual), there is no panel at all, otherwise only the part in use, in the same
; place. Less for the headset's compositor to blend over your view. Nothing that is shown is cut: with every HUD
; element on, the panel is simply whole, as before. A new element can show a few frames late (about 30 ms). While the
; wrist watch keeps the game's HUD on (your own HUD setting is contextual or off), the health / mana cluster the watch
; shows is left off the panel. 0 = the whole panel always, the cluster on it too
; @hidden
HudSkipEmpty = 1

; -----------------------------------------------------------------------------------------------------
[Performance.Shading]
; The parts of each eye's picture shaded at a lower rate, or not at all.

; NVIDIA RTX / GTX 16 and later only: fixed foveated rendering. Away from the centre of each lens the surfaces are
; shaded at a coarser rate (2x2 pixels, then 4x4), where the lens blurs anyway; edges and depth stay sharp. Faster
; when the GPU is the limit. Not eye-tracked. 0 = off
; @user  recommended: 0
FoveatedRendering = 0
; Each eye's picture is rendered larger than the lens shows (the game can only draw symmetric views, the lenses are
; not), and the lenses hide part of it: a share of it is never seen. 1 = that part is not shaded at all (faster,
; nothing visible changes).
; Disabled by default. Works, but causes screen space shader issues.
; 2 = only on the outer side of each eye (left of the left eye, right of the right eye), not between the eyes: less
; saved, but meant to keep the screen-space reflections, hair and glass whole. 0 = shade it all, as before
; @user  recommended: 2
OutOfViewMask = 2
; ---- hidden: most players never need to change these ----
; Degrees from each lens's centre shaded at full rate, and up to where 2x2 reaches (4x4 beyond)
; @hidden
FoveatedInner = 35
; @hidden
FoveatedOuter = 50
; How far beyond the lens's own field of view the picture is still shaded, in degrees (0 - 15): room for the headset
; turning the last picture with your head. Raise it if you see dark edges at the rim of your view on fast head turns
; @hidden
OutOfViewMaskMargin = 2
; With OutOfViewMask: also the parts the headset's lenses hide inside their field of view (the runtime's hidden-area
; mask, where it gives one; with OutOfViewMask = 1 only). 0 = only the part outside the field of view
; @hidden
OutOfViewMaskLens = 1
; With OutOfViewMask 1 or 2: also the two OUTER corners of each eye's picture (the left eye's left ones, the right
; eye's right ones) are not shaded, outside a rounded outline through the middle of each edge of the picture -- for
; headsets whose runtime gives no lens mask (a Pimax through SteamVR gives none). The number is how square
; the outline is: 4 leaves out ~3.5 % of each picture, 3 ~6 %, 2 (an ellipse) ~11 %; less shading in every geometry
; pass (the depth pass, lighting, water, transparent). Look at the far outer corners of your view: if you see black or
; flickering there, raise it (0 = off)
; @hidden
OutOfViewMaskCorners = 4

; -----------------------------------------------------------------------------------------------------
[Performance.StereoReuse]
; Experimental. With Stereo3D = 1 both eyes are drawn from the same instant, so some of the game's work for
; the right eye repeats exactly what it just did for the left. 1 = the right eye's frame skips it and uses
; the left eye's result (faster). If something then looks wrong or flickers, set that one back to 0.

; The sea's waves (the ocean's simulation)
; @hidden
StereoOceanReuse = 1
; Blood and marks on characters
; @hidden
StereoDecalReuse = 1
; Textures are streamed in once per pair of frames instead of every frame (slightly slower texture loading)
; @hidden
StereoStreamOncePerPair = 1
; The shadows of lamps and other spot / omni lights. The right eye uses the left eye's shadow maps whenever nothing
; about them changed between the two (the sun's: StereoSunShadowReuse below)
; @hidden
StereoLightShadowReuse = 1
; The sun's nearest shadow cascade (the sharp shadows within a few metres). The farther ones are already shared by the
; eyes (the game redraws them on alternate frames); the nearest was fitted to each eye and drawn twice. 1 = the right
; eye keeps the left eye's: the same shadow map, placement and reach, so the switch from the near shadows to the
; farther ones happens at the same place in both eyes, and the right eye does not draw it again. 0 = each eye its own
; @hidden
StereoSunShadowReuse = 1
; The auto-exposure (how bright the picture is made, adapting as you move between dark and light places): the right
; eye skips measuring its picture and adapts from the left eye's measurement, so both eyes always aim at the same
; brightness. The adaptation itself still runs every frame (as fast as before). Saves a little; mainly consistency
; @hidden
StereoExposureReuse = 1
; No longer used: skipping the reflection probes' update for the right eye broke its reflections (glass, shiny
; heads) and saved nearly nothing. Kept so an older file still reads
; @hidden
StereoReflectionReuse = 0

; -----------------------------------------------------------------------------------------------------
[Performance.SkippedWork]
; Experimental: work the game still does for effects that are off, or whose result nothing reads.

; Experimental: with AmbientOcclusion = 0 and the depth of field off, the game still does part of their work.
; 1 = the occlusion's: the game still draws its ambient occlusion and then overwrites it with a "no occlusion" fill;
; that first draw is skipped (about half the pass), once the mod has seen the fill cover it entirely -- the fill itself
; stays (it also stores each pixel's depth for later passes). Where the fill is a plain value it becomes a clear
; (learned a few seconds into each level; the log says what it found). 2 = also skip the depth of field's
; half-size copy of the image: that breaks water, electricity and faces (other effects read it), so do not use it.
; If lighting or effects look wrong after a few seconds in a level, set it back to 0
; @hidden
SkipDisabledEffects = 1
; Experimental: the depth pass's main shader (the plain walls, floors and props) is drawn depth-only: no pixel shader and
; no colour output. That output (a two-channel buffer) is the motion of each pixel, read only by the game's TAA
; anti-aliasing, so this is paused automatically while TAA is in use; with FXAA or no anti-aliasing the picture does
; not change and the GPU uses its faster depth-only path. If anything looks wrong (lighting, ambient occlusion,
; reflections, water, edges), set it back to 0
; @hidden
DepthPassDepthOnly = 1
; The depth pass copies its depth buffers several times a frame. A copy into a buffer that already holds exactly what it
; would copy (the same copy made earlier in the same pass, nothing drawn, cleared or copied into either buffer since)
; is skipped; and with the depth of field off (VrGraphicsTweaks) and the game's fog off (Fog = 0, outside FogMaps), so
; is the depth downsample then made only for its autofocus. The picture is the same. 0 = every copy made
; @hidden
DepthPassSkipRedundantCopies = 1
; The game's outline effect (the highlight drawn round outlined things and people) costs three full-screen passes per
; eye every frame, whether anything is outlined or not. 1 = the GPU skips them in any frame where nothing is outlined (it counts
; what the outlined objects drew and leaves the passes out when that is nothing: no delay, the outlines unchanged).
; 0 = always drawn
; @hidden
SkipEmptyOutlines = 1

