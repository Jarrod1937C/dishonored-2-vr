[Display.Fog]
; The game's fog, and the mod's own cheap distance fog that stands in for it.

; With the game's fog off (Fog = 0): the mod's own light distance fog, so distant hills and buildings fade into the
; colour of the sky round the horizon instead of standing out sharp. Cheap (drawn
; at full resolution, no blocks), with any anti-aliasing. Glass, rain and particles are drawn over it. 10 s the log says its colours. 0 = none
; Recommended on to replace the default in-game fog, is designed to be cheaper computationally as well.
; @hidden  recommended: 1
CheapFog = 1
; Metres from the eye where it begins, and where it reaches its full strength
; @user  recommended: 100
CheapFogStart = 100
; @user  recommended: 600
CheapFogEnd = 600
; Its strength at that distance: 0 = none, 1 = the far distance is all fog
; @user  recommended: 0.6
CheapFogOpacity = 0.6
; Its colour. auto = one of the three colours below, picked once per map by how bright its sky is above you (the
; upper part of your view: 25-75 deg up), a few seconds in: night, dusk or day. The log says which and why, to tune
; the two limits. sky = the average of the sky round the horizon, learned as you look round. Or one fixed colour
; R,G,B (0-255), e.g. 150,160,175, times CheapFogBrightness
; @user  recommended: auto
CheapFogColor = auto
; ---- hidden: most players never need to change these ----
; The game's own fog and haze while the headset shows the game. The game draws them at a reduced size, and in a
